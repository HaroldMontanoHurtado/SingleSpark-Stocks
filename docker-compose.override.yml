services:
  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    volumes:
      - ./ui:/app
      - /app/node_modules
    command: ["npm", "run", "dev"]
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:${BACKEND_PORT:-8081}

  backend:
    build:
      context: .                      # mantiene contexto = raíz para poder ver todos los archivos
      dockerfile: cmd/server/Dockerfile
    volumes:
      - ./cmd/server:/src/cmd/server    # monta para desarrollo
      - /go/pkg/mod                     # opcional cache del módulo
    command: ["air"]                    # o el que uses para hot-reload
    ports:
      - "${BACKEND_PORT:-8081}:8081"
