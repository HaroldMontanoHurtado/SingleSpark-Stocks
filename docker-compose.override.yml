services:
  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    volumes:
      - ./ui:/app:cached
      - /app/node_modules
    command: ["npm", "run", "dev"]
    ports:
      - "5173:5173"
    environment:
      # durante dev en host usamos la URL en el host para el backend.
      - VITE_API_BASE=http://host.docker.internal:${BACKEND_PORT:-8081}
    # En WSL/Windows, si host.docker.internal no resuelve, puede quedar como http://localhost:8081

  backend:
    build:
      context: .
      dockerfile: cmd/server/Dockerfile
    volumes:
      - ./cmd/server:/src/cmd/server:cached
      - /go/pkg/mod
    command: ["air"]
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    environment:
      - DB_URL=postgresql://root@cockroach:26257/${DB_NAME:-singlespark}?sslmode=disable
