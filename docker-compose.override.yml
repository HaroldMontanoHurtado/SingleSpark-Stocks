# Ubicación del archivo (raíz): /docker-compose.override.yml

services:
  backend:
    command: ["/usr/local/bin/backend"]
    volumes:
      - ./:/app:delegated
    working_dir: /app
    environment:
      GOFLAGS: -mod=mod
      DB_HOST: cockroachdb
      DB_PORT: "26257"
      DB_USER: root
      DB_PASS: ""
      DB_NAME: singlespark
      DB_SSLMODE: disable
      EXTERNAL_API_URL: "${EXTERNAL_API_URL:-https://api.karenai.click/swechallenge/list}"
      EXTERNAL_API_KEY: "${EXTERNAL_API_KEY:-}"
      HTTP_PORT: "${HTTP_PORT:-8081}"
    depends_on:
      cockroachdb:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8081}:${HTTP_PORT:-8081}"
    restart: unless-stopped

