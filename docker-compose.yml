# Ubicación del archivo (raíz): /docker-compose.yml

services:
  # ===============================
  # 🗄️ Base de datos CockroachDB
  # ===============================
  cockroachdb:
    image: cockroachdb/cockroach:v25.3.3
    command: start-single-node --insecure
    ports:
      - "26257:26257"
      - "8082:8080"
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "--host=localhost:26257", "-e", "SELECT 1;"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ===============================
  # ⚙️ Backend Go
  # ===============================
  backend:
    build:
      context: .
      dockerfile: cmd/server/Dockerfile
    depends_on:
      cockroachdb:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully
    environment:
      DB_HOST: cockroachdb
      DB_PORT: "26257"
      DB_USER: root
      DB_PASS: ""
      DB_NAME: singlespark
      DB_SSLMODE: disable
      EXTERNAL_API_URL: "${EXTERNAL_API_URL:-https://api.karenai.click/swechallenge/list}"
      EXTERNAL_API_KEY: "${EXTERNAL_API_KEY:-}"
      HTTP_PORT: "${HTTP_PORT:-8081}"
    ports:
      - "${HTTP_PORT:-8081}:${HTTP_PORT:-8081}"
    volumes:
      - ./migrations:/app/migrations:ro
    restart: on-failure

  # ===============================
  # 🧱 db_init — inicializador automático
  # ===============================
  # Este servicio crea la base de datos 'singlespark' y aplica las migraciones
  # automáticamente cuando levantas el entorno. Se ejecuta una sola vez.
  # Si deseas hacerlo manualmente, puedes comentar este bloque.
  db_init:
    image: cockroachdb/cockroach:v25.3.3
    depends_on:
      cockroachdb:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      set -euo pipefail;
      echo '🕘 Esperando 5s...' && sleep 5;
      echo '🔧 Creando DB singlespark si no existe...';
      cockroach sql --insecure --host=cockroachdb:26257 --execute 'CREATE DATABASE IF NOT EXISTS singlespark;';
      echo '📁 Aplicando migraciones...';
      for f in $(ls -1 /migrations/*.sql 2>/dev/null | sort); do
        echo "-- Ejecutando $$f --"; 
        cockroach sql --insecure --host=cockroachdb:26257 --database=singlespark < "$$f" || {
          echo "ERROR al ejecutar $$f" >&2; exit 1;
        };
      done;
      echo '✅ Migraciones completadas.';
    volumes:
      - ./migrations:/migrations:ro
    restart: "no"


  # ===============================
  # 🌐 Frontend Vue 3 (comentado)
