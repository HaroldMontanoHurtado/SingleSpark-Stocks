services:
  cockroach:
    image: ${COCKROACH_IMAGE:-cockroachdb/cockroach:v25.3.3}
    command: start-single-node --insecure --http-port=${COCKROACH_HTTP_PORT:-8080}
    ports:
      - "${COCKROACH_PORT:-26257}:26257"
      - "${COCKROACH_HTTP_PORT:-8080}:${COCKROACH_HTTP_PORT:-8080}"
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${COCKROACH_HTTP_PORT:-8080}/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.15.2
    depends_on:
      cockroach:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    entrypoint: ["sh", "-c"]
    command: >
      "sleep 3;
       migrate -path /migrations -database 'cockroach://root@cockroach:26257/${DB_NAME:-singlespark}?sslmode=disable' up || true"

  backend:
    build:
      context: .                            # contexto = raíz del proyecto
      dockerfile: cmd/server/Dockerfile   # ruta al Dockerfile
    environment:
      - DB_HOST=cockroach
      - DB_PORT=26257
      - DB_USER=${DB_USER:-root}
      - DB_NAME=${DB_NAME:-singlespark}
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    depends_on:
      cockroach:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  cockroach-data:
